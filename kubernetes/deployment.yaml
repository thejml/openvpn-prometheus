apiVersion: apps/v1
kind: Deployment
metadata:
  name: openvpn-exporter
  namespace: openvpn-exporter
  labels:
    app: openvpn-exporter
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openvpn-exporter
  template:
    metadata:
      labels:
        app: openvpn-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: openvpn-exporter
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      
      containers:
      - name: openvpn-exporter
        image: ghcr.io/thejml/openvpn-exporter:latest
        imagePullPolicy: IfNotPresent
        
        ports:
        - name: metrics
          containerPort: 8080
          protocol: TCP
        
        env:
        - name: PORT
          value: "8080"
        - name: LISTEN_ADDR
          value: "0.0.0.0"
        - name: OPENVPN_STATUS_FILE
          value: "/etc/openvpn/openvpn-status.log"
        
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
        
        livenessProbe:
          httpGet:
            path: /health
            port: metrics
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /health
            port: metrics
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 2
        
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        
        volumeMounts:
        - name: openvpn-status
          mountPath: /etc/openvpn
          readOnly: true
        - name: tmp
          mountPath: /tmp
      
      volumes:
      - name: openvpn-status
        persistentVolumeClaim:
          claimName: openvpn-status-pvc
          readOnly: true
      - name: tmp
        emptyDir: {}
      
      nodeSelector:
        kubernetes.io/os: linux
      
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - openvpn-exporter
              topologyKey: kubernetes.io/hostname
