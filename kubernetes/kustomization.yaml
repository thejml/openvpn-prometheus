apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: default

commonLabels:
  app: openvpn-exporter

resources:
  - persistentVolume.yaml
  - serviceaccount.yaml
  - service.yaml
  - deployment.yaml

replicas:
  - name: openvpn-exporter
    count: 1

# Configure image name and tag
images:
  - name: ghcr.io/thejml/openvpn-exporter
    newTag: latest
